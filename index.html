<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/normalize.css">
    <link rel="stylesheet" href="/styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    

</head>
<body>
    <header>
        <h1>Practica Peliculas</h1>
    </header>
    <main>
        <section id="add-peliculas">
            <h2>Añadir pelicula</h2>
            <img class="bg-img" src="https://cloudfront-eu-central-1.images.arcpublishing.com/prisaradio/U3OTPO4CNZHSJA5JOBVXKJMKMQ.jpg" alt="Cine vacio">
           <form id="peliculas-form">
               
               <label for="titulo">Titulo</label>
               <input type="text" name="titulo" id="titulo" placeholder="Titulo" required>
               <label for="anio">Año</label>
               <input type="number" name="anio" id="anio" placeholder="Año" required>
               <label for="descripcion">Descripcion</label>
               <textarea name="descripcion" id="descripcion" placeholder="Descripcion" required></textarea>          
                <label for="foto">Url de la foto</label>
               <input type="url" name="foto" id="foto" placeholder="Imagen Pelicula" >
               <label for="genero">Genero</label>
               <input type="text" name="genero" id="genero" placeholder="Genero" required>

               <button type="submit">Añadir Pelicula</button>

           </form>
        </section>
        <section>
            <h2>Escribe tu pelicula</h2>
            
            <input type="text" id="filtroTitulo" placeholder="Buscar película..." oninput="filtrarPorTitulo()">
            
            <div id="peliculas-filtradas"></div>

            <h2>Busqueda por Genero</h2>
            <select name="filtro-genero" id="filtroGenero">
                    <option value="todos">Todos</option>
                    <option value="Terror">Terror</option>
                    <option value="Accion">Accion</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Romantica">Romantica</option>
            </select>
        </section>

        <section id="filtered-peliculas">
            
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
